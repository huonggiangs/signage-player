name: Build Signage Player APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # đưa lỗi biên dịch thành annotation để đọc được mà không cần đăng nhập
            grep -E "^e: |error:|What went wrong|Execution failed|> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-400)"
            done
          fi
          exit $code
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk signage-player-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: signage-player-debug
          path: signage-player-debug.apk
      - name: Publish release debug-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest signage-player-debug.apk --prerelease \
            --title "Signage Player debug" --notes "Build ${{ github.sha }}"
